# ==============================================================================
#  PICOM CONFIGURATION - HIGH PERFORMANCE CATPPUCCIN AESTHETICS
# ==============================================================================

# --- Backend & Performance ---
backend = "xrender";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;
vsync = false;

# --- Rounded Corners ---
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'Conky'"
];

# --- Shadows ---
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-color = "#11111b";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g = 'Polybar'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- Fading Animations ---
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 8;
fade-exclude = [];

# --- Transparency & Opacity ---
inactive-opacity = 0.95;
frame-opacity = 1.0;
inactive-opacity-override = false;
active-opacity = 1.0;

opacity-rule = [
  "100:class_g = 'Polybar'",
  "95:class_g = 'kitty' && focused",
  "85:class_g = 'kitty' && !focused",
  "98:class_g = 'Rofi'",
  "95:class_g = 'Dunst'",
  "100:class_g = 'feh'",
  "100:class_g = 'mpv'",
  "100:fullscreen"
];

# --- Background Blur (Disabled for smooth 60fps performance without lag) ---
# blur: {
#   method = "dual_kawase";
#   strength = 5;
# }

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'Conky'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- General Settings ---
dithered-present = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.98; };
  dropdown_menu = { opacity = 0.98; };
};
