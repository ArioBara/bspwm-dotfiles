# ==============================================================================
#  POLYBAR MAIN CONFIGURATION - FLOATING PILLS ISLAND THEME
# ==============================================================================

include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 98%
height = 28
offset-x = 1%
offset-y = 6px
radius = 10
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.mauve}

border-size = 1
border-color = ${colors.surface1}

padding-left = 2
padding-right = 2
module-margin = 0

separator = ""
separator-foreground = ${colors.transparent}

# Fonts
font-0 = "JetBrainsMono Nerd Font:style=Medium:size=9.5;3"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=11;3"
font-2 = "JetBrainsMono Nerd Font:style=Regular:size=13;3"

# Modules Layout
modules-left = launcher quick-kitty quick-ranger sep bspwm sep title
modules-center = media
modules-right = cpu sep memory sep battery sep network sep date sep theme sep control-center sep powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
override-redirect = false

[settings]
screenchange-reload = true
pseudo-transparency = false
