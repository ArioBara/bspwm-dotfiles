# ==============================================================================
#  POLYBAR MODULES CONFIGURATION - CLEAN SEAMLESS CATPPUCCIN MOCHA THEME
# ==============================================================================

[module/sep]
type = custom/text
format = "  "
format-foreground = ${colors.transparent}

[module/dot]
type = custom/text
format = " • "
format-foreground = ${colors.surface2}

# --- 1. App Launcher ---
[module/launcher]
type = custom/text
format = "󰣇"
format-font = 2
format-foreground = ${colors.mauve}
format-padding = 1
click-left = ~/.config/rofi/launcher.sh
click-right = ~/.config/rofi/powermenu.sh

# --- Quick Launcher: Kitty Terminal ---
[module/quick-kitty]
type = custom/text
format = "󰄛"
format-font = 2
format-foreground = ${colors.teal}
format-padding = 1
click-left = kitty &
click-right = kitty --class kitty-float &

# --- Quick Launcher: Ranger File Manager ---
[module/quick-ranger]
type = custom/text
format = "󰉋"
format-font = 2
format-foreground = ${colors.yellow}
format-padding = 1
click-left = kitty --class ranger-term -e ranger &
click-right = nemo || caja || kitty &

# --- 2. BSPWM Workspaces (Circled Numbers) ---
[module/bspwm]
type = internal/bspwm

pin-workspaces = true
inline-mode = false
enable-click = true
enable-scroll = true
reverse-scroll = false

ws-icon-0 = 1;󰲠
ws-icon-1 = 2;󰲢
ws-icon-2 = 3;󰲤
ws-icon-3 = 4;󰲦
ws-icon-4 = 5;󰲨
ws-icon-5 = 6;󰲪
ws-icon-default = 󰍹

format = <label-state> <label-mode>
format-padding = 0

# Focused: Workspace aktif (Lingkaran ungu menyala)
label-focused = "%icon%"
label-focused-foreground = ${colors.mauve}
label-focused-padding = 1

# Occupied: Workspace berisi jendela (Lingkaran lavender)
label-occupied = "%icon%"
label-occupied-foreground = ${colors.lavender}
label-occupied-padding = 1

# Urgent: Workspace ada notifikasi (Lingkaran merah)
label-urgent = "%icon%"
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1

# Empty: Workspace kosong (Lingkaran abu-abu redup)
label-empty = "%icon%"
label-empty-foreground = ${colors.overlay0}
label-empty-padding = 1

# --- 3. Window Title ---
[module/title]
type = internal/xwindow
format = <label>
format-prefix = "󰖯 "
format-prefix-foreground = ${colors.lavender}
format-foreground = ${colors.subtext0}
format-padding = 1
label = "%title%"
label-maxlen = 32
label-empty = "Desktop"
label-empty-foreground = ${colors.overlay0}

# --- 4. Media Playerctl ---
[module/media]
type = custom/script
exec = ~/.config/polybar/scripts/playerctl.sh
interval = 1
format = <label>
format-foreground = ${colors.teal}
format-padding = 1
click-left = ~/.config/polybar/scripts/playerctl.sh play-pause
click-right = ~/.config/polybar/scripts/playerctl.sh next
click-middle = ~/.config/polybar/scripts/playerctl.sh previous
scroll-up = ~/.config/polybar/scripts/playerctl.sh vol-up
scroll-down = ~/.config/polybar/scripts/playerctl.sh vol-down

# --- 5. CPU Usage ---
[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.peach}
format = <label>
format-foreground = ${colors.text}
format-padding = 1
label = "%percentage:2%%"
click-left = kitty --class btop-term -e btop &

# --- 6. Memory (RAM) Usage ---
[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.blue}
format = <label>
format-foreground = ${colors.text}
format-padding = 1
label = "%used% (%percentage_used%%)"
click-left = kitty --class btop-term -e btop &

# --- 7. Battery Monitor ---
[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT0
adapter = AC
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-charging-foreground = ${colors.text}
format-charging-padding = 1
label-charging = "%percentage%%"

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-foreground = ${colors.text}
format-discharging-padding = 1
label-discharging = "%percentage%%"

format-full = <ramp-capacity> <label-full>
format-full-foreground = ${colors.text}
format-full-padding = 1
label-full = "100%"

format-low = <animation-low> <label-low>
format-low-foreground = ${colors.red}
format-low-padding = 1
label-low = "%percentage%%"

ramp-capacity-0 = "󰂎 "
ramp-capacity-1 = "󰁺 "
ramp-capacity-2 = "󰁻 "
ramp-capacity-3 = "󰁼 "
ramp-capacity-4 = "󰁽 "
ramp-capacity-5 = "󰁾 "
ramp-capacity-6 = "󰁿 "
ramp-capacity-7 = "󰂀 "
ramp-capacity-8 = "󰂁 "
ramp-capacity-9 = "󰂂 "
ramp-capacity-10 = "󰁹 "
ramp-capacity-foreground = ${colors.green}

animation-charging-0 = "󰂆 "
animation-charging-1 = "󰂈 "
animation-charging-2 = "󰂉 "
animation-charging-3 = "󰂊 "
animation-charging-4 = "󰂅 "
animation-charging-framerate = 750
animation-charging-foreground = ${colors.green}

animation-low-0 = "󰂃 "
animation-low-1 = "󰁺 "
animation-low-framerate = 500
animation-low-foreground = ${colors.red}

# --- 8. PulseAudio / Volume ---
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5

format-volume = <ramp-volume> <label-volume>
format-volume-foreground = ${colors.teal}
format-volume-padding = 1
label-volume = "%percentage%%"
label-volume-foreground = ${colors.text}

label-muted = "󰝟 Muted"
label-muted-foreground = ${colors.red}
label-muted-padding = 1

ramp-volume-0 = "󰕿 "
ramp-volume-1 = "󰖀 "
ramp-volume-2 = "󰕾 "
ramp-volume-foreground = ${colors.teal}

click-right = pavucontrol || kitty --class mixer-term -e alsamixer &
click-left = pamixer -t 2>/dev/null || pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up = pamixer -i 5 2>/dev/null || pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pamixer -d 5 2>/dev/null || pactl set-sink-volume @DEFAULT_SINK@ -5%

# --- 8. Network ---
[module/network]
type = internal/network
interface-type = wired
interval = 3.0

format-connected = <label-connected>
format-connected-prefix = "󰤨 "
format-connected-prefix-foreground = ${colors.sky}
format-connected-foreground = ${colors.text}
format-connected-padding = 1
label-connected = "%downspeed:min%"

format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰤭 "
format-disconnected-prefix-foreground = ${colors.overlay0}
format-disconnected-foreground = ${colors.overlay0}
format-disconnected-padding = 1
label-disconnected = "Offline"

# --- 9. Date & Time ---
[module/date]
type = internal/date
interval = 1.0

date = %a, %d %b
time = %H:%M:%S

format = <label>
format-prefix = "%{A1:/home/ario/.config/polybar/scripts/calendar.sh:}󰥔 %{A}"
format-prefix-foreground = ${colors.lavender}
format-foreground = ${colors.text}
format-padding = 1
label = "%{A1:/home/ario/.config/polybar/scripts/calendar.sh:}%date%  %time%%{A}"

# --- 10. Control Center / Action Center ---
[module/control-center]
type = custom/text
format = "󰍜"
format-font = 2
format-foreground = ${colors.pink}
format-padding = 1
click-left = ~/.config/rofi/controlcenter.sh

# --- 11. Powermenu ---
[module/powermenu]
type = custom/text
format = "󰐥"
format-font = 2
format-foreground = ${colors.red}
format-padding = 1
click-left = ~/.config/rofi/powermenu.sh

# --- 12. Style / Theme Switcher ---
[module/theme]
type = custom/text
format = "󰏘"
format-font = 2
format-foreground = ${colors.peach}
format-padding = 1
click-left = ~/.config/bspwm/scripts/theme_switcher.sh &
click-right = ~/.config/bspwm/scripts/set_wallpaper.sh random &
